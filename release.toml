# Ymir release config for weirdnet-project-helpers (scripts/weirdnet_release.py, vendored; never edit it here).
helpers = "0.3.2"
project = "ymir"
require_message = true
next = [
  "build the release files: the Release workflow (.github/workflows/release.yml) builds every platform and variant; download its artifacts into dist/",
  "python3 scripts/weirdnet_release.py github {version}   # upload dist/ to the GitHub release",
  "python3 scripts/weirdnet_release.py assets {version}   # every platform file is on the release",
  "python3 scripts/package.py --recipe, commit, then: python3 scripts/weirdnet_release.py taur {version} --dry-run",
]

[env]
CARGO_TARGET_DIR = "/scratch/cargo-target/ymir"

[[files]]                       # [workspace.package] version; every crate uses version.workspace
kind = "cargo-workspace"
path = "Cargo.toml"
primary = true

[[files]]
kind = "cargo-lock"
path = "Cargo.lock"

[[files]]                       # workspace dependencies on ymir-core, ymird, ymirctl (path + version; crates are publish = false)
kind = "regex"
path = "Cargo.toml"
pattern = '^((?:ymir-core|ymird|ymirctl) = \{ path = "crates/[a-z-]+", version = ")\d+\.\d+\.\d+(?:-[a-z]+\.\d+)?"'
replace = '\g<1>{version}"'
count = 3

[[files]]                       # the Homebrew template's version (sha256s come from the release workflow)
kind = "regex"
path = "packaging/homebrew/ymir.rb"
pattern = '^(  version ")\d+\.\d+\.\d+(?:-[a-z]+\.\d+)?"'
replace = '\g<1>{version}"'

[changelog]
path = "CHANGELOG.md"

[[requires]]                    # LoRA adapters (live changes, per-request scale) need this release on crates.io
crate = "weirdnet-backends"
version = "0.4.1"
manifest = "Cargo.toml"         # the workspace dependency keeps its features; checked, not rewritten
lock = "Cargo.lock"
pin = "none"

[checks]
commands = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  "cargo test --workspace --locked",
]

[crates]
# The ymir-* crates are publish = false: the generic ones move to weirdnet-* crates (Weirdnet lead).
publish = []

[taur]
org = "WeirdBrains"

[[taur.packages]]
name = "ymir-bin"
dir = "packaging/arch/ymir-bin"
srcinfo = "generate"
source_contains = "v{version}"

[[taur.packages]]
name = "ymir-cuda-bin"
dir = "packaging/arch/ymir-cuda-bin"
srcinfo = "generate"
source_contains = "v{version}"

# Two variants of every file: `ymir` (llama.cpp with CPU and Vulkan, Metal on macOS) and `ymir-cuda`
# (llama.cpp with CUDA 13 and its runtime), each with the engine bundled (scripts/engine.py).
[github]
files = [
  "dist/ymir-{version}-*-unknown-linux-gnu.tar.gz",
  "dist/ymir-{version}-*-unknown-linux-gnu.zip",
  "dist/ymir_{debver}-1_*.deb",
  "dist/ymir-{version}-1.*.rpm",
  "dist/ymir-bin-{pkgver}-1-*.pkg.tar.zst",
  "dist/ymir-cuda-{version}-*-unknown-linux-gnu.tar.gz",
  "dist/ymir-cuda-{version}-*-unknown-linux-gnu.zip",
  "dist/ymir-cuda_{debver}-1_*.deb",
  "dist/ymir-cuda-{version}-1.*.rpm",
  "dist/ymir-cuda-bin-{pkgver}-1-*.pkg.tar.zst",
  "dist/ymir-{version}-*-apple-darwin.tar.gz",
  "dist/ymir-{version}-*-apple-darwin.zip",
  "dist/ymir-{version}-*-pc-windows-msvc.zip",
  "dist/ymir-cuda-{version}-*-pc-windows-msvc.zip",
  "dist/ymir-{version}-*.msi",
  "dist/YmirSetup-{version}.exe",
]
sums = "SHA256SUMS"

[[platforms]]
os = "linux"
arch = ["x86_64", "aarch64"]
formats = ["tar.gz", "zip", "deb", "rpm", "pkg.tar.zst", "nix"]
channels = ["github", "taur", "nix"]
assets = [
  "ymir-{version}-x86_64-unknown-linux-gnu.tar.gz",
  "ymir-{version}-aarch64-unknown-linux-gnu.tar.gz",
  "ymir_{debver}-1_amd64.deb",
  "ymir_{debver}-1_arm64.deb",
  "ymir-{version}-1.x86_64.rpm",
  "ymir-{version}-1.aarch64.rpm",
  "ymir-bin-{pkgver}-1-x86_64.pkg.tar.zst",
  "ymir-bin-{pkgver}-1-aarch64.pkg.tar.zst",
  "ymir-cuda-{version}-x86_64-unknown-linux-gnu.tar.gz",
  "ymir-cuda-{version}-aarch64-unknown-linux-gnu.tar.gz",
  "ymir-cuda_{debver}-1_amd64.deb",
  "ymir-cuda_{debver}-1_arm64.deb",
  "ymir-cuda-{version}-1.x86_64.rpm",
  "ymir-cuda-{version}-1.aarch64.rpm",
  "ymir-cuda-bin-{pkgver}-1-x86_64.pkg.tar.zst",
  "ymir-cuda-bin-{pkgver}-1-aarch64.pkg.tar.zst",
]

[[platforms]]
os = "macos"
arch = ["x86_64", "aarch64"]
formats = ["tar.gz", "zip", "brew-formula"]
channels = ["github", "homebrew"]
assets = ["ymir-{version}-*-apple-darwin.tar.gz"]

[[platforms]]
os = "windows"
arch = ["x86_64", "aarch64"]
formats = ["zip", "exe", "exe-wix"]  # exe-wix: YmirSetup (WiX 7 bundle) around ymir-VERSION-ARCH.msi
channels = ["github"]
assets = ["ymir-{version}-*-pc-windows-msvc.zip", "ymir-cuda-{version}-x86_64-pc-windows-msvc.zip", "YmirSetup-{version}.exe"]

[[platforms]]
os = "android"
opt_out = "a serving daemon can't run in the background on mobile (Android needs a foreground service and thermals make it impractical)"

[[platforms]]
os = "ios"
opt_out = "a serving daemon can't run in the background on mobile (iOS forbids it)"
