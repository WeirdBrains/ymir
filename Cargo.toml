[workspace]
resolver = "3"
members = [
    "crates/ymir-core",
    "crates/ymird",
    "crates/ymirctl",
    "crates/ymir-testkit",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.99"
license = "BSD-3-Clause"
repository = "https://github.com/WeirdBrains/ymir"
authors = ["Weird Brains LLC"]

[workspace.dependencies]
async-trait = "0.1"
# Crates in this workspace. The ones marked "to be extracted" in their README are generic and move
# to weirdnet-* crates (Weirdnet lead); app crates depend on them only through these names.
ymir-core = { path = "crates/ymir-core", version = "0.10.0" }
ymird = { path = "crates/ymird", version = "0.10.0" }
ymirctl = { path = "crates/ymirctl", version = "0.10.0" }

# Published Weirdnet crates, used as they are.
weirdnet-agent = { version = "0.5.2", features = ["pool", "serve"] }
weirdnet-backends = { version = "0.4.3", features = ["node"] }
weirdnet-device-link = "0.4.2"
weirdnet-model = { version = "0.5.1", default-features = false }
weirdnet-net = "=0.8.2"
weirdnet-openai = "0.2.2"
weirdnet-semcache = "0.2.1"
weirdnet-sync = "0.7.1"
weirdnet-alerts = { version = "0.2.2", features = ["backends"] }
weirdnet-rules = "=0.1.1"
weirdnet-update = { version = "0.2.2", features = ["wire"] }
# MCP server (JSON-RPC, tool tables, stdio and HTTP transports, resources); no weirdnet-agent.
weirdnet-mcp = { version = "0.6", features = ["stdio-server", "axum"] }

anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures = "0.3"
getrandom = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "ring", "webpki-roots", "hostname"] }
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream"] }
semver = "1"
sha2 = "0.10"
regex = "1"
hex = "0.4"
zeroize = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
toml = "0.9"
# Edits node.toml in place (keeps comments and layout).
toml_edit = { version = "0.23", features = ["serde"] }
tracing = "0.1"
ureq = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# ymird's Windows service (the service control manager's dispatcher and stop requests).
windows-service = "0.8"
# ymirctl bench's code sandbox on Windows (a Job Object).
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
# Release files ship stripped binaries.
strip = true
