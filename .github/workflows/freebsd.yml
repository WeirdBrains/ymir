# FreeBSD (M9 BSD packages): ymird and ymirctl built and tested in a FreeBSD 14.2 VM, packaged as
# a tar.gz and a pkg (scripts/package.py), the pkg installed, and ymird run as an rc.d service
# (`ymirctl service install --system --run-as ymir`) that answers a chat through the mock engine,
# stops (no engine left running) and uninstalls. FreeBSD can't be cross-checked from Linux
# (aws-lc-sys needs a FreeBSD sysroot), hence the VM. Manual, and on pushes that touch the
# service or packaging code.
name: FreeBSD

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['crates/ymir-core/src/service.rs', 'scripts/package.py', '.github/workflows/freebsd.yml']

permissions:
  contents: read

jobs:
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: cross-platform-actions/action@v0.29.0
        with:
          operating_system: freebsd
          version: '14.2'
          memory: 12G
          cpu_count: 4
          run: |
            set -eux
            set -o pipefail
            sudo pkg install -y ca_root_nss curl git cmake pkgconf python3 perl5
            # The pkg `rust` lags the crates' minimum, so use rustup's stable.
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            . "$HOME/.cargo/env"
            # The VM's disk is small: no debug info or incremental files, and the debug tree goes
            # before the release build.
            export CARGO_INCREMENTAL=0 CARGO_PROFILE_DEV_DEBUG=0 CARGO_PROFILE_TEST_DEBUG=0
            cargo test --locked -p ymir-core --lib
            cargo test --locked -p ymirctl
            cargo build --locked -p ymir-testkit --bin ymir-mock-engine
            cp target/debug/ymir-mock-engine /tmp/ymir-mock-engine
            rm -rf target/debug
            df -h .
            cargo build --release --locked -p ymird -p ymirctl
            python3 scripts/package.py --out dist
            ls -l dist
            V=$(python3 -c "import re;print(re.search(r'\[workspace\.package\][^\[]*?\nversion\s*=\s*\"([^\"]+)\"', open('Cargo.toml').read(), re.S).group(1))")
            tar tzf "dist/ymir-$V-x86_64-unknown-freebsd.tar.gz" | grep -q bin/ymird
            sudo pkg add "dist/ymir-$V-x86_64-unknown-freebsd.pkg"
            pkg info ymir
            /usr/local/bin/ymirctl --version
            # The rc.d service, as root, running as an unprivileged account.
            sudo pw useradd ymir -d /var/db/ymir -s /usr/sbin/nologin || true
            printf 'GGUF mock' > /tmp/tiny.gguf
            M=/tmp/ymir-mock-engine
            chmod 755 "$M"
            H=/var/db/ymir
            sudo /usr/local/bin/ymirctl --home "$H" setup --name ci --backend llamacpp --llama-server "$M" --model /tmp/tiny.gguf --port 18484
            sudo /usr/local/bin/ymirctl --home "$H" service install --system --run-as ymir --dry-run | tee out.txt
            grep -q 'would write /usr/local/etc/rc.d/ymird' out.txt
            timeout 120 sudo /usr/local/bin/ymirctl --home "$H" service install --system --run-as ymir --ymird /usr/local/bin/ymird
            up() { for i in $(seq 60); do sudo /usr/local/bin/ymirctl --home "$H" service status --system | grep -q 'ymird: answering' && return 0; sleep 1; done; return 1; }
            down() { for i in $(seq 60); do sudo /usr/local/bin/ymirctl --home "$H" service status --system | grep -q 'ymird: not answering' && return 0; sleep 1; done; return 1; }
            up || { sudo cat "$H/state/logs/ymird.log"; exit 1; }
            sudo /usr/local/bin/ymirctl --home "$H" service status --system | tee status.txt
            grep -q 'rc.d: ymird is running' status.txt
            ps -axo user,command | grep '[y]mird --home' | grep -q '^ymir '
            timeout 120 sudo /usr/local/bin/ymirctl --home "$H" chat hi | tee chat.txt
            grep -q 'You said: hi' chat.txt
            timeout 120 sudo /usr/local/bin/ymirctl --home "$H" service stop --system
            down
            sleep 2
            if pgrep -f ymir-mock-engine; then echo "an engine outlived ymird"; exit 1; fi
            timeout 120 sudo /usr/local/bin/ymirctl --home "$H" service uninstall --system
            test ! -e /usr/local/etc/rc.d/ymird
            if sysrc -n ymird_enable 2>/dev/null; then echo 'ymird_enable is still set'; exit 1; fi
            sudo pkg delete -y ymir
