# Build the Jaspr site (site/) and deploy it to GitHub Pages from main. Same pattern as
# WeirdBrains/weirdnet-site. Served at https://weirdbrains.github.io/ymir/ until a custom domain is set up.
name: Pages

on:
  push:
    branches: ['main']
    paths: ['site/**', 'roadmap.toml', 'ROADMAP.md', 'brand/**', '.github/workflows/pages.yml']
  pull_request:
    paths: ['site/**', 'roadmap.toml', 'ROADMAP.md', 'brand/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.14.0"
      - name: Activate jaspr CLI
        run: dart pub global activate jaspr_cli 0.24.0-beta.1
      - run: dart pub get
      - run: dart analyze
      - name: The roadmap pages match roadmap.toml
        run: python3 tool/gen_roadmap.py --check
      - name: Build the static site
        # CUSTOM_DOMAIN (a repository variable) switches to the custom domain: root-relative links,
        # the sibling site's domain and a CNAME file. Unset, the site is the github.io project page.
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            jaspr build --sitemap-domain "https://$CUSTOM_DOMAIN" \
              --dart-define=SITE_BASE=/ --dart-define="SITE_URL=https://$CUSTOM_DOMAIN" \
              --dart-define=SIBLING_URL=https://bragi.weirdbrains.com/
            echo "$CUSTOM_DOMAIN" > build/jaspr/CNAME
          else
            jaspr build --sitemap-domain https://weirdbrains.github.io/ymir
          fi
      - name: Check the output
        run: |
          test -f build/jaspr/index.html
          test -f build/jaspr/roadmap/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: site/build/jaspr

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
