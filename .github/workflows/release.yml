# Build Ymir's release files for every platform and engine variant, with llama.cpp bundled
# (scripts/engine.py, pinned in packaging/engines/llama.cpp.toml), and smoke-test them: each
# default Linux and macOS archive is unpacked and runs a real tiny GGUF through ymirctl setup,
# ymird and the bridge (crates/ymir-testkit/tests/real_bundle.rs).
#
# Runs on v* tags and by hand. It only builds and uploads workflow artifacts: publishing a GitHub
# release, TAUR or Homebrew stays with scripts/weirdnet_release.py (see release.toml `next`).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: 'Git ref to build (for example v0.1.0). Empty uses this workflow ref.'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # SmolLM2-135M-Instruct, Q4_K_M (105 MB, Apache-2.0): the smoke test's model.
  SMOKE_GGUF_URL: https://huggingface.co/bartowski/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf

jobs:
  linux:
    name: linux (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps ymird's glibc requirement low (2.35).
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: aarch64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      YMIR_ENGINE_CACHE: ${{ github.workspace }}/.engine-cache
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.checkout_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - name: Packaging tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm
      - name: Build
        run: cargo build --release --locked -p ymird -p ymirctl
      - name: Engines run on this runner
        run: |
          python3 scripts/engine.py fetch --target ${{ matrix.arch }}-unknown-linux-gnu --variant default --out /tmp/engine-default --check
          python3 scripts/engine.py fetch --target ${{ matrix.arch }}-unknown-linux-gnu --variant cuda --out /tmp/engine-cuda --check
      - name: Package (default and CUDA)
        run: |
          python3 scripts/package.py --target ${{ matrix.arch }}-unknown-linux-gnu --variant default --engine /tmp/engine-default
          python3 scripts/package.py --target ${{ matrix.arch }}-unknown-linux-gnu --variant cuda --engine /tmp/engine-cuda
          rm -rf /tmp/engine-cuda .engine-cache
          ls -la dist
      - name: Smoke test the default archive with a real model
        run: |
          mkdir -p /tmp/bundle && tar xzf dist/ymir-[0-9]*-${{ matrix.arch }}-unknown-linux-gnu.tar.gz -C /tmp/bundle
          curl -sSfL -o /tmp/tiny.gguf "$SMOKE_GGUF_URL"
          YMIR_TEST_BUNDLE=$(echo /tmp/bundle/ymir-*) YMIR_TEST_GGUF=/tmp/tiny.gguf \
            cargo test --locked -p ymir-testkit --test real_bundle -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  arch:
    name: arch packages
    needs: linux
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.checkout_ref || github.ref }}
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-linux-*
          path: linux
          merge-multiple: true
      - name: makepkg (as a normal user)
        run: |
          pacman -Sy --noconfirm --needed python
          useradd -m builder
          chown -R builder .
          su builder -c "python3 scripts/package.py --out dist-arch --pacman-from linux/ymir-*-unknown-linux-gnu.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-arch
          path: dist-arch/*.pkg.tar.zst
          if-no-files-found: error

  macos:
    name: macos (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p ymird -p ymirctl
      - name: Package
        run: |
          python3 scripts/engine.py fetch --target ${{ matrix.target }} --out /tmp/engine --check
          python3 scripts/package.py --target ${{ matrix.target }} --engine /tmp/engine
          ls -la dist
      - name: Smoke test with a real model
        run: |
          mkdir -p /tmp/bundle && tar xzf dist/ymir-*-${{ matrix.target }}.tar.gz -C /tmp/bundle
          curl -sSfL -o /tmp/tiny.gguf "$SMOKE_GGUF_URL"
          YMIR_TEST_BUNDLE=$(echo /tmp/bundle/ymir-*) YMIR_TEST_GGUF=/tmp/tiny.gguf \
            cargo test --locked -p ymir-testkit --test real_bundle -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  windows:
    name: windows (${{ matrix.target }}, ${{ matrix.variant }})
    # ymird builds and runs as a service on Windows (named-pipe control, logon task, Windows
    # service; CI tests them). Kept non-blocking until a release has shipped the Windows files.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, runner: windows-2022, variant: default }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022, variant: cuda }
          - { target: aarch64-pc-windows-msvc, runner: windows-11-arm, variant: default }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.checkout_ref || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p ymird -p ymirctl
      - name: Package
        shell: bash
        run: |
          python scripts/engine.py fetch --target ${{ matrix.target }} --variant ${{ matrix.variant }} --out engine --check
          python scripts/package.py --target ${{ matrix.target }} --variant ${{ matrix.variant }} --engine engine
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}-${{ matrix.variant }}
          path: dist/
          if-no-files-found: error


  windows-installer:
    name: windows installers (MSI, YmirSetup exe)
    needs: windows
    continue-on-error: true
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.checkout_ref || github.ref }}
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*-pc-windows-msvc-default
          path: zips
          merge-multiple: true
      # WiX 7 is used under the Open Source Maintenance Fee EULA v1.1, accepted for WeirdBrains
      # projects on 2026-11-12; every wix command passes -acceptEula wix7.
      - name: Install pinned WiX 7.0.1
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $url = "https://github.com/wixtoolset/wix/releases/download/v7.0.1/wix-cli-x64.msi"
          $expected = "93673c89ab33b1fd3f07ad5e609b7cae694bd716b2914259b61a41c02303b64c"
          $msi = Join-Path $env:RUNNER_TEMP "wix-cli-x64.msi"
          Invoke-WebRequest -Uri $url -OutFile $msi
          $actual = (Get-FileHash -Algorithm SHA256 -Path $msi).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "WiX MSI hash mismatch: $actual != $expected" }
          $p = Start-Process msiexec.exe -ArgumentList @("/i", "`"$msi`"", "/qn", "/norestart") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "WiX install failed: $($p.ExitCode)" }
          $wixBin = "C:\Program Files\WiX Toolset v7.0\bin"
          & (Join-Path $wixBin "wix.exe") extension add -acceptEula wix7 -g WixToolset.UI.wixext/7.0.1 WixToolset.Util.wixext/7.0.1 WixToolset.BootstrapperApplications.wixext/7.0.1
          if ($LASTEXITCODE -ne 0) { throw "wix extension add failed: $LASTEXITCODE" }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin
      - name: MSIs and YmirSetup exe (unsigned)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq "ymird" | Select-Object -ExpandProperty version
          $msis = @{}
          foreach ($t in @(@{ triple = "x86_64-pc-windows-msvc"; arch = "x64" }, @{ triple = "aarch64-pc-windows-msvc"; arch = "arm64" })) {
            $zip = "zips\ymir-$version-$($t.triple).zip"
            if (!(Test-Path $zip)) { Write-Host "::warning::no $zip, so no $($t.arch) MSI"; continue }
            $dir = Join-Path $env:RUNNER_TEMP $t.arch
            Expand-Archive -Path $zip -DestinationPath $dir
            $rel = (Get-ChildItem $dir -Directory | Select-Object -First 1).FullName
            powershell -File packaging\windows\make-installer.ps1 -ReleaseDir $rel -Version $version -Arch $t.arch -OutDir dist
            if ($LASTEXITCODE -ne 0) { throw "MSI build failed ($($t.arch))" }
            $msis[$t.arch] = (Resolve-Path "dist\ymir-$version-$($t.arch).msi").Path
          }
          if (-not $msis.ContainsKey("x64")) { throw "no x64 MSI" }
          $setup = @("-Setup", "-MsiX64", $msis["x64"], "-Version", $version, "-OutDir", "dist")
          if ($msis.ContainsKey("arm64")) { $setup += @("-MsiArm64", $msis["arm64"]) }
          powershell -File packaging\windows\make-installer.ps1 @setup
          if ($LASTEXITCODE -ne 0) { throw "YmirSetup build failed" }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows-installers
          path: dist/
          if-no-files-found: error

  sums:
    name: SHA256SUMS
    needs: [linux, arch, macos, windows, windows-installer]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: One SHA256SUMS for every file
        run: |
          cd dist && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
