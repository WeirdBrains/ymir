[package]
name = "ymir-alerts"
description = "Node health alerts: weirdnet-rules rule packs, dedupe and recovery, SMTP, webhook and push sinks. To be extracted into weirdnet-alerts."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
chrono.workspace = true
futures.workspace = true
lettre.workspace = true
# Webhooks go through hyper-rustls with ring (like lettre), not reqwest: turning on reqwest's
# rustls feature would switch TLS on for every reqwest client in the workspace and pull in the
# aws-lc C build, which doesn't cross-build for the BSDs.
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "tls12", "ring", "webpki-tokio"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
weirdnet-rules.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
