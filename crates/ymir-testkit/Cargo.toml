[package]
name = "ymir-testkit"
description = "Test support for Ymir: a mock llama-server and the end-to-end tests. Never shipped."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ymir-mock-engine"
path = "src/bin/ymir-mock-engine.rs"
test = false

[features]
# The M5 mid-answer failover tests, which need a weirdnet-agent newer than 0.4.1 (see
# ymir-core's `agent-prefix`). Run them with a local `[patch]` to the lead's main.
agent-prefix = ["ymir-core/agent-prefix"]

[dependencies]
axum.workspace = true
futures.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
anyhow.workspace = true
libc.workspace = true
reqwest.workspace = true
tempfile.workspace = true
clap.workspace = true
weirdnet-agent.workspace = true
weirdnet-backends.workspace = true
weirdnet-model.workspace = true
weirdnet-net.workspace = true
weirdnet-openai.workspace = true
weirdnet-sync.workspace = true
weirdnet-alerts.workspace = true
ymir-core.workspace = true
ymirctl.workspace = true

[lints]
workspace = true
