# The roadmap, one source of truth. `site/tool/gen_roadmap.py` renders it to ROADMAP.md and to
# the site's Roadmap page (site/lib/content/roadmap.dart). Keep it consistent with docs/DESIGN.md
# ("Milestones (Ymir)" and the status sections); update both in the same change.
#
# status: "done" | "in-progress" | "planned"

[project]
name = "Ymir"
updated = "2026-11-24"
intro = "Ymir is built in milestones. Each one lands its Weirdnet crate work first, published on crates.io, and then the Ymir side. Status comes from the design doc. Training work follows a separate plan: P1, P4a and P2 are built; P3a and P4b are built and tested with a mock trainer and mock models."
design = "https://github.com/WeirdBrains/ymir/blob/main/docs/DESIGN.md"
unpublished = ["weirdnet-push"]   # planned crates with no crates.io page yet

[[milestone]]
id = "M0"
title = "Design"
status = "done"
summary = "The repo, the names, the three roles and the decisions, written down in the design doc and reviewed by the Weirdnet lead."
crates = []

[[milestone]]
id = "M1"
title = "One box, three roles in one daemon"
status = "done"
summary = "One machine runs the model, inference and app roles in a single `ymird`. It detects the hardware, picks models that fit, runs llama.cpp, and serves an OpenAI-compatible endpoint on loopback so Jan and scripts work. `ymirctl setup` writes the config."
crates = ["weirdnet-model", "weirdnet-backends", "weirdnet-openai", "weirdnet-semcache"]

[[milestone]]
id = "M2"
title = "Model-node parity with existing llama-swap servers"
status = "done"
summary = "vLLM as a second engine (managed, or wrapping a server that is already running), idle unload, restart with backoff after a crash, a small stand-in model that answers while a big one loads, alerts, a user service and Linux packages."
crates = ["weirdnet-backends", "weirdnet-alerts", "weirdnet-model"]

[[milestone]]
id = "M3"
title = "Roles over Weirdnet"
status = "done"
summary = "The same three roles talk across devices over Weirdnet. An app node reaches inference nodes, inference nodes drive model nodes, and only devices in your own roster are let in. `ymirctl` and Jan work on another machine through that machine's own loopback endpoint."
crates = ["weirdnet-agent", "weirdnet-net", "weirdnet-sync", "weirdnet-device-link", "weirdnet-backends", "weirdnet-model"]

[[milestone]]
id = "M4"
title = "Several model nodes"
status = "done"
summary = "More than one model node in the pool: linking devices, each node advertising what it can run, one combined model list, failover before the first token, and draining a node before maintenance."
crates = ["weirdnet-device-link", "weirdnet-relay", "weirdnet-net", "weirdnet-agent", "weirdnet-backends"]

[[milestone]]
id = "M5"
title = "Context sync and failover"
status = "done"
summary = "Conversations are kept in sync across inference nodes, so a reply can resume mid-answer after a model node or an inference node dies, with the full context and no repeated text."
crates = ["weirdnet-agent", "weirdnet-sync"]

[[milestone]]
id = "M6"
title = "Workload spreading"
status = "in-progress"
summary = "Load balancing across replicas, fair sharing between devices, priority classes, batch jobs that fan out across nodes, and the pool benchmark are built. Next: moving models between nodes, placement and replication, and a semantic cache."
crates = ["weirdnet-agent", "weirdnet-backends", "weirdnet-semcache"]

[[milestone]]
id = "M7"
title = "Split models"
status = "in-progress"
summary = "A model too big for one machine is split across several with llama.cpp RPC: an opt-in pool policy, private-link-only planning, group up and down, and teardown when a member is lost. Next: vLLM with Ray groups."
crates = ["weirdnet-backends"]

[[milestone]]
id = "M8"
title = "Move existing servers onto Ymir"
status = "done"
summary = "The servers that served models before now run on Ymir. The move was made one step at a time, with the owner approving each step."
crates = []

[[milestone]]
id = "M9"
title = "Breadth and hardening"
status = "in-progress"
summary = "Built: self-update with rollback (pinned root, signed bundles, trial boots), agent tasks (task/1) for Bragi's agent mode, the Windows service, a security review with checks that run, a `[model] callers` guard so a model node can refuse app devices, Inkling 2 Mini, automatic context sizing (fit fixes in 0.3.0 and 0.3.1), MLX mock end-to-end tests, outside MCP servers for tasks, and a bundle fetcher (`ymirctl update fetch` and `update watch`, which hears announcements from a relay). Next: push wake-ups, BSD packages, and MLX-LM for Inkling 2 Mini once mlx-lm#2086 is in a release (vLLM and llama.cpp already serve it)."
crates = ["weirdnet-update", "weirdnet-push", "weirdnet-agent"]

[[milestone]]
id = "M10"
title = "Cert-only server link"
status = "done"
summary = "Servers can be linked cert-only: a node certificate and a signed service grant, never the root seed, so a stolen server is never you and one node can be revoked without rotating your identity. `ymirctl pool add --service inference|model` sends such a link, `pool link --cert-only` takes only that, and `pool cert-only` moves a node that holds the seed and wipes its copy."
crates = ["weirdnet-sync", "weirdnet-device-link"]

[[milestone]]
id = "P1"
title = "Data generation and evals"
status = "done"
summary = "Built: `ymirctl batch --jsonl` and `ymirctl eval` (teacher integrity, manifests, resume, bench scorers and an optional judge). The teacher's license comes from `--license`, the Hub repo's model card (`--license-from`) or the pool catalog, and `ymirctl train seed` turns source texts into seed prompts in two passes through the teacher. Left: a job record that stays in sync across nodes."
crates = ["weirdnet-agent"]

[[milestone]]
id = "P4a"
title = "LoRA adapters on a loaded base"
status = "done"
summary = "Built: LoRA adapters served on a loaded base, on llama.cpp and vLLM, each advertised in the catalog as its own model with its base. `ymirctl models adapter` adds, lists, serves and rescales them, `models pull --adapter-for` fetches them, a vLLM base can keep LoRA slots free to take adapters without a restart, and an adapter trained on another revision of its base is not served. Versioned rollout and canaries are P4b."
crates = ["weirdnet-backends", "weirdnet-agent", "weirdnet-openai", "weirdnet-alerts"]

[[milestone]]
id = "P4b"
title = "Versions, canaries and rollback"
status = "done"
summary = "Built: a rollout name in the pool policy with versions behind it and a traffic weight each. Each conversation stays on one version, `name@N` pins a version, and `ymirctl models rollout` adds versions, changes weights live, rolls back and retires. A version gets up to 10% of new conversations freely; more needs a `ymirctl eval` result at least as good as the current version's. Tested against mock models; not yet with a real fine-tune."
crates = []

[[milestone]]
id = "P2"
title = "Training data from conversations"
status = "done"
summary = "Built: a per-conversation training consent that is off unless you turn it on and syncs between your devices, `ymirctl context train` to set or withdraw it, `context export --training` to write only the consented conversations as chat-format JSONL with system prompts, tools, attachments and reasoning stripped and patterns redacted, owner-only and never synced, and `context withdrawn` to list what an earlier export should drop."
crates = ["weirdnet-agent", "weirdnet-sync"]

[[milestone]]
id = "P3"
title = "Fine-tuning as a pool job"
status = "in-progress"
summary = "P3a is built: `ymirctl train run` fine-tunes a llama.cpp base on one node with the pinned upstream llama.cpp build (a full fine-tune, then a LoRA adapter extracted from it), from a dataset with a recorded source and license. The node's GPU is held for the run with `weirdnet-backends`' new reservation, so its models unload and nothing loads there until the run ends. The llama.cpp trainer (`scripts/trainer.py`: `llama-finetune` at the engine's pinned build, then LoRA extraction by truncated SVD) is built and tested against a fake `llama-finetune`; no real run yet. Next: a first real run on a node the lead clears. P3b's Ymir side is built: `train run --job` checkpoints each epoch and `train resume` carries a job on from its last checkpoint, on a local stand-in for the synced job record that `weirdnet-agent` 0.6.0 will provide."
crates = ["weirdnet-backends", "weirdnet-agent"]

