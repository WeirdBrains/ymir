# The roadmap, one source of truth. `site/tool/gen_roadmap.py` renders it to ROADMAP.md and to
# the site's Roadmap page (site/lib/content/roadmap.dart). Keep it consistent with docs/DESIGN.md
# ("Milestones (Ymir)" and the status sections); update both in the same change.
#
# status: "done" | "in-progress" | "planned"

[project]
name = "Ymir"
updated = "2026-11-19"
intro = "Ymir is built in milestones. Each one lands its Weirdnet crate work first, published on crates.io, and then the Ymir side. Status comes from docs/DESIGN.md."
design = "https://github.com/WeirdBrains/ymir/blob/main/docs/DESIGN.md"
unpublished = ["weirdnet-push"]   # planned crates with no crates.io page yet

[[milestone]]
id = "M0"
title = "Design"
status = "done"
summary = "The repo, the names, the three roles and the decisions, written down in docs/DESIGN.md and reviewed by the Weirdnet lead."
crates = []
gaps = []

[[milestone]]
id = "M1"
title = "One box, three roles in one daemon"
status = "done"
summary = "One machine runs the model, inference and app roles in a single `ymird`. It detects the hardware, picks models that fit, runs llama.cpp, and serves an OpenAI-compatible endpoint on loopback so Jan and scripts work. `ymirctl setup` writes the config."
crates = ["weirdnet-model", "weirdnet-backends", "weirdnet-openai", "weirdnet-semcache"]
gaps = ["The quickstart has run on one NVIDIA PC only. A unified-memory box, a Mac and a CPU-only box are not tried yet."]

[[milestone]]
id = "M2"
title = "Model-node parity with existing llama-swap servers"
status = "done"
summary = "vLLM as a second engine (managed, or wrapping a server that is already running), idle unload, restart with backoff after a crash, a small stand-in model that answers while a big one loads, alerts, a user service and Linux packages."
crates = ["weirdnet-backends", "weirdnet-alerts", "weirdnet-model"]
gaps = [
  "vLLM is tested on one NVIDIA GPU only, not on newer or unified-memory hardware.",
  "Nothing is released yet: no rpm, no signatures, no macOS or Windows builds.",
  "Alerts have only run in dry-run, so nothing real was ever sent.",
]

[[milestone]]
id = "M3"
title = "Roles over Weirdnet"
status = "done"
summary = "The same three roles talk across devices over Weirdnet. An app node reaches inference nodes, inference nodes drive model nodes, and only devices in your own roster are let in. `ymirctl` and Jan work on another machine through that machine's own loopback endpoint."
crates = ["weirdnet-agent", "weirdnet-net", "weirdnet-sync", "weirdnet-device-link", "weirdnet-backends", "weirdnet-model"]
gaps = [
  "Nothing is tested across real machines yet. Every multi-node test ran on one computer (in-memory and loopback).",
  "Linking the owner's real Weirdnet identity is still to do.",
  "One roster-sync test fails about half the time, a known upstream issue.",
]

[[milestone]]
id = "M4"
title = "Several model nodes"
status = "done"
summary = "More than one model node in the pool: linking devices, each node advertising what it can run, one combined model list, failover before the first token, and draining a node before maintenance."
crates = ["weirdnet-device-link", "weirdnet-relay", "weirdnet-net", "weirdnet-agent", "weirdnet-backends"]
gaps = [
  "The cross-machine run did not happen. Every multi-node test ran on one computer.",
  "Routing is ready node first, then fewest requests in flight. It does not yet weigh hardware, speed or warm prompts.",
]

[[milestone]]
id = "M5"
title = "Context sync and failover"
status = "done"
summary = "Conversations are kept in sync across inference nodes, so a reply can resume mid-answer after a model node or an inference node dies, with the full context and no repeated text."
crates = ["weirdnet-agent", "weirdnet-sync"]
gaps = [
  "No eviction or working sets yet: inference nodes keep every conversation, until `weirdnet-sync` can drop a local copy.",
  "Job checkpoints, attachments, retrieved context and prefix hints are not built. The conversation store lives in Ymir until `weirdnet-agent` has a context module.",
  "Tested on one computer with a mock engine; no cross-machine run yet.",
]

[[milestone]]
id = "M6"
title = "Workload spreading"
status = "in-progress"
summary = "Load balancing across replicas, moving models around the cloud, fair sharing between devices, priority classes, batch jobs, a shared answer cache, and several inference nodes active at once. Balancing, the per-device cap, priorities and batch fan-out are built; placement and the shared cache are not."
crates = ["weirdnet-agent", "weirdnet-backends", "weirdnet-semcache"]
gaps = [
  "No scheduler lease, placement plan, model swapping across nodes, replication or prefix warming yet: they need a lease and a synced plan from weirdnet-sync.",
  "No shared (semantic) answer cache across nodes yet.",
  "A batch job lives on the node that submitted it; it is not synced, so another node can't pick it up.",
  "Every answer waits 3 s per linked device the app can't reach (12 to 15 s in the multi-node test) before it starts: a `weirdnet-agent` 0.4.2 bug in finding inference nodes, reported to the Weirdnet lead. The first-token test waits on that fix.",
  "Tested on one computer with a mock engine.",
]

[[milestone]]
id = "M7"
title = "Split models"
status = "in-progress"
summary = "A model too big for one machine is split across several (vLLM with Ray, or llama.cpp RPC), reproducing the big mode on two large-memory machines. The llama.cpp RPC path is built and tested on one machine over loopback, with a real model: opt-in pool policy, private-link-only planning, group up and down, teardown on member loss."
crates = ["weirdnet-backends"]
gaps = [
  "vLLM/Ray (tensor parallel over RoCE) groups are not built: they need two machines with fast links, which were off limits.",
  "The big mode has not been reproduced as a group job on real servers; that needs m3talsmith's go-ahead.",
  "Capability records carry no link information, so private links, ports and memory are declared in the pool policy and link speed is not measured (upstream request).",
  "A crashed worker on another node is noticed only when that node leaves the pool or a request fails; alerts for a lost group are logged, not delivered.",
  "A group is started by the operator (ymirctl group up); placement and leases wait on sync 0.7.0.",
]

[[milestone]]
id = "M8"
title = "Move existing servers onto Ymir"
status = "planned"
summary = "The servers that serve models today move to Ymir, one step at a time, with the owner approving each step."
crates = []
gaps = []

[[milestone]]
id = "M9"
title = "Breadth and hardening"
status = "in-progress"
summary = "Built: self-update with rollback on weirdnet-update (pinned root, signed bundles, trial boots), agent tasks (task/1) for Bragi's agent mode, and a security review with checks that run, and a `[model] callers` guard so a model node can refuse app devices. Not built: push wake-ups, the Windows service, BSD packages, a bundle fetcher. The four upstream issues are still open. Revoked model nodes are now refused and `[model] callers` takes peer ids only."
crates = ["weirdnet-update", "weirdnet-push", "weirdnet-agent"]
gaps = [
  "Push wake-ups wait on the Weirdnet front end of `weirdnet-push` (does not exist) and on Apple and Google credentials from m3talsmith.",
  "Windows service, named-pipe control and BSD packages are not built or tried.",
  "Self-update takes a bundle directory: no fetcher or relay announcements yet, nothing signed with a real org key, and it was only run on one box with test keys.",
  "Upstream, still open: weirdnet-openai #1 and #2, weirdnet-agent #1, weirdnet-backends #1. New asks written up: a `tasks` field in `Serving`, roles in authorization, and an unsigned signing identity for plain file sets.",
  "The security review is the author's. Fixed in 6d9bacd and a67848a: revoked or unrostered model nodes are refused, and `[model] callers` takes peer ids only. A model node still accepts any linked device unless `callers` is set; roles in authorization come with agent 0.4.4.",
  "No run across real machines, so the 1.0 criteria in DESIGN.md are mostly open.",
]

[[milestone]]
id = "M10"
title = "Cert-only server link"
status = "planned"
summary = "Service nodes get their own certificate and sync keys without holding the root seed, so one node can be revoked without rotating your identity. m3talsmith approved the design on 2026-11-20. Most of the crates are now published (weirdnet-sync 0.7.0, weirdnet-device-link 0.4.0, weirdnet-agent 0.4.4, weirdnet-backends 0.1.2); the Weirdnet lead is still verifying them, and weirdnet-update 0.2.1 and the adoption notes come later. Ymir wires M10 up after that. A majority-vote lease follows as weirdnet-sync 0.8.0 after M10."
crates = ["weirdnet-sync", "weirdnet-device-link"]
gaps = [
  "Waiting on the Weirdnet lead: sync 0.7.0, device-link 0.4.0, agent 0.4.4 and backends 0.1.2 are published but still being verified; update 0.2.1 and the adoption notes are not out. Ymir uses sync 0.5.2 and device-link 0.3.0 today, which have no cert-only link. The design and what Ymir changes are in DESIGN.md.",
  "Until then every model and inference node holds the root seed in a 0600 file.",
]
