# The roadmap, one source of truth. `site/tool/gen_roadmap.py` renders it to ROADMAP.md and to
# the site's Roadmap page (site/lib/content/roadmap.dart). Keep it consistent with docs/DESIGN.md
# ("Milestones (Ymir)" and the status sections); update both in the same change.
#
# status: "done" | "in-progress" | "planned"

[project]
name = "Ymir"
updated = "2026-11-23"
intro = "Ymir is built in milestones. Each one lands its Weirdnet crate work first, published on crates.io, and then the Ymir side. Status comes from the design doc. Training work follows a separate plan: P1 is built, P4a is starting, and P2 and P3 have not started."
design = "https://github.com/WeirdBrains/ymir/blob/main/docs/DESIGN.md"
unpublished = ["weirdnet-push"]   # planned crates with no crates.io page yet

[[milestone]]
id = "M0"
title = "Design"
status = "done"
summary = "The repo, the names, the three roles and the decisions, written down in the design doc and reviewed by the Weirdnet lead."
crates = []

[[milestone]]
id = "M1"
title = "One box, three roles in one daemon"
status = "done"
summary = "One machine runs the model, inference and app roles in a single `ymird`. It detects the hardware, picks models that fit, runs llama.cpp, and serves an OpenAI-compatible endpoint on loopback so Jan and scripts work. `ymirctl setup` writes the config."
crates = ["weirdnet-model", "weirdnet-backends", "weirdnet-openai", "weirdnet-semcache"]

[[milestone]]
id = "M2"
title = "Model-node parity with existing llama-swap servers"
status = "done"
summary = "vLLM as a second engine (managed, or wrapping a server that is already running), idle unload, restart with backoff after a crash, a small stand-in model that answers while a big one loads, alerts, a user service and Linux packages."
crates = ["weirdnet-backends", "weirdnet-alerts", "weirdnet-model"]

[[milestone]]
id = "M3"
title = "Roles over Weirdnet"
status = "done"
summary = "The same three roles talk across devices over Weirdnet. An app node reaches inference nodes, inference nodes drive model nodes, and only devices in your own roster are let in. `ymirctl` and Jan work on another machine through that machine's own loopback endpoint."
crates = ["weirdnet-agent", "weirdnet-net", "weirdnet-sync", "weirdnet-device-link", "weirdnet-backends", "weirdnet-model"]

[[milestone]]
id = "M4"
title = "Several model nodes"
status = "done"
summary = "More than one model node in the pool: linking devices, each node advertising what it can run, one combined model list, failover before the first token, and draining a node before maintenance."
crates = ["weirdnet-device-link", "weirdnet-relay", "weirdnet-net", "weirdnet-agent", "weirdnet-backends"]

[[milestone]]
id = "M5"
title = "Context sync and failover"
status = "done"
summary = "Conversations are kept in sync across inference nodes, so a reply can resume mid-answer after a model node or an inference node dies, with the full context and no repeated text."
crates = ["weirdnet-agent", "weirdnet-sync"]

[[milestone]]
id = "M6"
title = "Workload spreading"
status = "in-progress"
summary = "Load balancing across replicas, fair sharing between devices, priority classes, batch jobs that fan out across nodes, and the pool benchmark are built. Next: moving models between nodes, placement and replication, and a semantic cache."
crates = ["weirdnet-agent", "weirdnet-backends", "weirdnet-semcache"]

[[milestone]]
id = "M7"
title = "Split models"
status = "in-progress"
summary = "A model too big for one machine is split across several with llama.cpp RPC: an opt-in pool policy, private-link-only planning, group up and down, and teardown when a member is lost. Next: vLLM with Ray groups."
crates = ["weirdnet-backends"]

[[milestone]]
id = "M8"
title = "Move existing servers onto Ymir"
status = "done"
summary = "The servers that served models before now run on Ymir. The move was made one step at a time, with the owner approving each step."
crates = []

[[milestone]]
id = "M9"
title = "Breadth and hardening"
status = "in-progress"
summary = "Built: self-update with rollback (pinned root, signed bundles, trial boots), agent tasks (task/1) for Bragi's agent mode, the Windows service, a security review with checks that run, a `[model] callers` guard so a model node can refuse app devices, Inkling 2 Mini, automatic context sizing (fit fixes in 0.3.0 and 0.3.1), MLX mock end-to-end tests, and outside MCP servers for tasks. Next: push wake-ups, BSD packages, a bundle fetcher, and MLX-LM for Inkling 2 Mini once mlx-lm#2086 is in a release (vLLM and llama.cpp already serve it)."
crates = ["weirdnet-update", "weirdnet-push", "weirdnet-agent"]

[[milestone]]
id = "M10"
title = "Cert-only server link"
status = "planned"
summary = "Service nodes get their own certificate and sync keys without holding the root seed, so one node can be revoked without rotating your identity. The design is approved and the Weirdnet crates are published; Ymir wires it up next. A majority-vote lease follows as weirdnet-sync 0.8.0."
crates = ["weirdnet-sync", "weirdnet-device-link"]

[[milestone]]
id = "P1"
title = "Data generation and evals"
status = "done"
summary = "Built: `ymirctl batch --jsonl` and `ymirctl eval` (teacher integrity, manifests, resume, bench scorers and an optional judge). Left: the teacher license read from the Hugging Face Hub, turning sources into seed prompts, and a job record that stays in sync across nodes."
crates = ["weirdnet-agent"]

[[milestone]]
id = "P4a"
title = "LoRA adapters on a loaded base"
status = "in-progress"
summary = "Serve LoRA adapters on an already-loaded base model (llama.cpp first): a first-class adapter list in the catalog, each advertised as its own model. Work is starting. Versioned rollout and canaries (P4b) wait on this. P2 and P3 have not started."
crates = ["weirdnet-backends", "weirdnet-model"]

[[milestone]]
id = "P2"
title = "Training data from conversations"
status = "planned"
summary = "Export only the conversations the user has marked for training, with chosen parts stripped, as a dataset that never leaves their devices. Not started."
crates = ["weirdnet-agent", "weirdnet-sync"]

[[milestone]]
id = "P3"
title = "Fine-tuning as a pool job"
status = "planned"
summary = "A LoRA or QLoRA run on one capable GPU node at background priority, with serving paused or moved off that node. Not started. A synced job record and resume on another node come later (P3b)."
crates = ["weirdnet-backends", "weirdnet-agent"]

